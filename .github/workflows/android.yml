name: Build Wear Fullscreen

on:
  workflow_dispatch:
  push:
    paths:
      - 'NestCam_Watch8_Fullscreen_OneUpload.zip'
      - 'wear/**'
      - 'shared/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-wear-fullscreen.yml'

jobs:
  wear-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare project
        shell: bash
        run: |
          if [[ -f NestCam_Watch8_Fullscreen_OneUpload.zip ]]; then
            mkdir -p extracted-source
            unzip -oq NestCam_Watch8_Fullscreen_OneUpload.zip -d extracted-source
            echo 'PROJECT_DIR=extracted-source' >> "$GITHUB_ENV"
          else
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          fi

      - name: Build watch APK only
        shell: bash
        run: gradle -p "$PROJECT_DIR" :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: NestCam-Watch8-Fullscreen-APK
          path: ${{ env.PROJECT_DIR }}/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
