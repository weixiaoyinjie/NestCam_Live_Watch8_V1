
name: Build NestCam Mobile + Watch8

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build both APKs
        run: gradle --no-daemon :mobile:assembleDebug :wear:assembleDebug

      - name: Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: nestcam-mobile-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Galaxy Watch 8 APK
        uses: actions/upload-artifact@v4
        with:
          name: nestcam-watch8-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
