name: Build NestCam Mobile + Watch8

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore fixed NestCam source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="NestCam_Source_Bundle-1.zip"
          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "::error::Missing fixed source ZIP: $SOURCE_ZIP"
            exit 1
          fi
          echo "Using $SOURCE_ZIP"
          unzip -oq "$SOURCE_ZIP" -d .
          for f in settings.gradle build.gradle mobile/build.gradle wear/build.gradle shared/build.gradle; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing source file: $f"
              exit 1
            fi
          done
          if ! grep -q 'LinearLayout.LayoutParams videoParams=' wear/src/main/java/com/nestcam/watch8/wear/WatchActivity.java; then
            echo "::error::This is not the WatchActivity.java fixed V1.1 source (videoParams absent)."
            exit 1
          fi
          echo "Fixed source V1.1 restored successfully"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls -1 "$SDK/platforms" || true
          ls -1 "$SDK/build-tools" || true
          if [[ ! -d "$SDK/platforms/android-35" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              echo "::error::Missing sdkmanager at $SDKMANAGER"
              exit 1
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build both APKs
        run: gradle --no-daemon :mobile:assembleDebug :wear:assembleDebug

      - name: Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: nestcam-mobile-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Galaxy Watch 8 APK
        uses: actions/upload-artifact@v4
        with:
          name: nestcam-watch8-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
